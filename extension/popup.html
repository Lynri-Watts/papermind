<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperMind Reader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      min-height: 300px;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #F8FAFC;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #334155;
      background: rgba(59, 130, 246, 0.1);
    }

    .icon {
      font-size: 24px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #3B82F6, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .content {
      padding: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #0F172A;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #3B82F6;
    }

    .stat-label {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 4px;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .primary-btn {
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      color: #FFFFFF;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .secondary-btn {
      background: #0F172A;
      color: #F8FAFC;
      border: 1px solid #334155;
    }

    .secondary-btn:hover {
      border-color: #3B82F6;
      color: #3B82F6;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #334155;
      text-align: center;
    }

    .footer-text {
      font-size: 11px;
      color: #64748B;
    }

    .footer-text a {
      color: #3B82F6;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">📚</span>
    <span class="title">PaperMind</span>
  </div>
  
  <div class="content">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Notes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Highlights</div>
      </div>
    </div>

    <button class="action-btn primary-btn" onclick="openSidebar()">
      Open Reader
    </button>
    
    <button class="action-btn secondary-btn" onclick="openMainApp()">
      Open Full App
    </button>
  </div>

  <div class="footer">
    <div class="footer-text">
      Powered by <a href="#" target="_blank">PaperMind AI</a>
    </div>
  </div>

  <script>
    function openSidebar() {
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        chrome.tabs.sendMessage(tabs[0].id, { action: 'toggleSidebar' });
        window.close();
      });
    }

    function openMainApp() {
      chrome.tabs.create({ url: 'http://localhost:5173' });
      window.close();
    }
  </script>
</body>
</html>
